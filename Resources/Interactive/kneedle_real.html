<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visual and interactive explanation of the Kneedle algorithm.">
  <title>Kneedle — visual interactive explanation</title>
  <style>
    :root {
      --ink: #10252d;
      --muted: #5b6c72;
      --paper: #f7f4ec;
      --surface: #fffdf7;
      --line: #d7d2c5;
      --teal: #16777a;
      --teal-soft: #dcefee;
      --orange: #e98226;
      --orange-soft: #f9e5d2;
      --navy: #153743;
      --white: #ffffff;
      --shadow: 0 18px 48px rgba(16, 37, 45, 0.13);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 12% 15%, rgba(22,119,122,.09), transparent 28rem),
        radial-gradient(circle at 88% 85%, rgba(233,130,38,.08), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }
    button { font: inherit; cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 22px clamp(18px, 4vw, 58px) 24px;
      gap: 16px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center;
      background: var(--navy); color: var(--white);
      font-weight: 850; letter-spacing: -.04em;
      box-shadow: 0 8px 24px rgba(21,55,67,.2);
    }
    .brand-text strong { display: block; font-size: 1.05rem; }
    .brand-text span { color: var(--muted); font-size: .82rem; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button, .nav-button {
      border: 1px solid var(--line); background: rgba(255,255,255,.65); color: var(--ink);
      border-radius: 12px; transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .icon-button:hover, .nav-button:hover { transform: translateY(-1px); border-color: var(--teal); background: var(--white); }
    .icon-button { width: 42px; height: 42px; display: grid; place-items: center; }
    .icon-button svg { width: 20px; height: 20px; }

    .stepper { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 4px; position: relative; }
    .stepper::before {
      content: ""; position: absolute; left: 5%; right: 5%; top: 17px;
      height: 2px; background: var(--line); z-index: 0;
    }
    .step-tab {
      position: relative; z-index: 1; border: 0; background: transparent; color: var(--muted);
      display: grid; justify-items: center; gap: 5px; padding: 0 2px; min-width: 0;
    }
    .step-tab .number {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: var(--surface); border: 2px solid var(--line); font-weight: 800; transition: .2s ease;
    }
    .step-tab .label { font-size: .69rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
    .step-tab.done .number { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
    .step-tab.active { color: var(--ink); }
    .step-tab.active .number {
      background: var(--orange); border-color: var(--orange); color: var(--white);
      transform: scale(1.08); box-shadow: 0 7px 20px rgba(233,130,38,.28);
    }

    .stage {
      position: relative; min-height: 548px;
      background: rgba(255,253,247,.88); border: 1px solid rgba(215,210,197,.85);
      border-radius: var(--radius); box-shadow: var(--shadow);
      display: grid; grid-template-columns: minmax(265px,.76fr) minmax(520px,1.55fr);
      overflow: hidden;
    }
    .explanation {
      padding: clamp(28px,4vw,58px);
      background: linear-gradient(145deg,rgba(220,239,238,.74),rgba(255,253,247,.4));
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; justify-content: center;
    }
    .eyebrow { color: var(--teal); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 16px; font-size: clamp(2rem,3.7vw,3.8rem); line-height: .98; letter-spacing: -.055em; }
    .lead { margin: 0; color: var(--muted); font-size: clamp(1rem,1.35vw,1.2rem); line-height: 1.58; }
    .insight { margin-top: 27px; padding-left: 16px; border-left: 4px solid var(--orange); font-weight: 700; line-height: 1.45; }
    .visual { min-width: 0; padding: clamp(22px,3.2vw,46px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .visual-content { width: 100%; max-width: 940px; }
    .chart-shell { width: 100%; position: relative; }
    .chart-title { margin: 0 0 4px; font-size: .88rem; font-weight: 800; }
    .chart-subtitle { margin: 0 0 8px; color: var(--muted); font-size: .76rem; }
    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .chart text { font-family: inherit; fill: var(--muted); font-size: 11px; }
    .chart .axis-title { fill: var(--ink); font-weight: 750; }
    .chart .grid { stroke: var(--line); stroke-width: 1; opacity: .65; }
    .chart .axis { stroke: #9f988b; stroke-width: 1.2; }
    .chart .curve { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linejoin: round; }
    .chart .curve-tail { fill: none; stroke: var(--orange); stroke-width: 3; stroke-linejoin: round; }
    .chart .raw-line { fill: none; stroke: var(--line); stroke-width: 1.2; opacity: .8; }
    .chart .point { fill: var(--teal); stroke: none; }
    .chart .point-muted { fill: #789697; stroke: none; }
    .chart .point-tail { fill: var(--orange); stroke: none; }
    .chart .chord { stroke: var(--navy); stroke-width: 2.5; }
    .chart .distance { stroke: var(--orange); stroke-width: 2; stroke-dasharray: 5 4; }
    .chart .distance-faint { stroke: var(--orange); stroke-width: 1.2; opacity: .22; }
    .chart .cutoff { stroke: var(--orange); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .chart .tail-zone { fill: var(--orange-soft); opacity: .72; }
    .chart .side-zone { fill: var(--teal-soft); opacity: .64; }
    .chart .knee-ring { fill: var(--surface); stroke: var(--orange); stroke-width: 4; }
    .chart .annotation { fill: var(--ink); font-weight: 800; }
    .chart .annotation-orange { fill: #a95413; font-weight: 800; }
    .chart .brace { fill: none; stroke: var(--orange); stroke-width: 2.5; }
    .chart .mini-frame { fill: rgba(255,255,255,.45); stroke: var(--line); }

    .metric-row { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-top: 9px; }
    .step-8 .metric-row { margin-top: 18px; }
    .metric { padding: 11px 13px; border-top: 3px solid var(--teal); background: rgba(220,239,238,.35); }
    .metric.orange { border-top-color: var(--orange); background: rgba(249,229,210,.45); }
    .metric span { display: block; color: var(--muted); font-size: .69rem; font-weight: 750; text-transform: uppercase; letter-spacing: .07em; }
    .metric strong { display: block; margin-top: 4px; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .distance-readout {
      display: flex; justify-content: center; gap: 22px; flex-wrap: wrap;
      margin-top: 8px; color: var(--muted); font-size: .77rem;
    }
    .distance-readout strong { color: var(--ink); }
    .formula {
      margin-top: 10px; text-align: center; color: var(--muted); font-size: .78rem;
    }
    .formula code { color: var(--ink); background: var(--orange-soft); padding: 4px 8px; border-radius: 8px; }

    .footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; }
    .progress-copy { color: var(--muted); font-size: .8rem; }
    .nav-actions { display: flex; gap: 10px; }
    .nav-button { padding: 11px 18px; font-weight: 800; }
    .nav-button.next { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .keyboard-tip { justify-self: end; color: var(--muted); font-size: .75rem; }
    .final-quote {
      display: none; width: min(92%,780px); margin: 24px auto 0;
      text-align: center; color: var(--navy); font-weight: 800;
    }
    .step-8 .final-quote { display: block; }

    @media (max-width: 1050px) {
      .stage { grid-template-columns: 1fr; }
      .explanation { border-right: 0; border-bottom: 1px solid var(--line); padding: 27px; }
      h1 { font-size: 2.55rem; }
      .visual { padding: 25px; }
      .final-quote { width: auto; margin: 22px 28px 4px; }
    }
    @media (max-width: 730px) {
      .app { padding: 14px; gap: 12px; }
      .brand-text span, .keyboard-tip, .step-tab .label { display: none; }
      .stepper::before { left: 5%; right: 5%; top: 15px; }
      .step-tab .number { width: 30px; height: 30px; font-size: .78rem; }
      .stage { min-height: 0; border-radius: 17px; }
      .explanation, .visual { padding: 21px; }
      h1 { font-size: 2.05rem; }
      .lead { font-size: .95rem; }
      .metric-row { grid-template-columns: 1fr; }
      .metric { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .metric strong { margin-top: 0; }
      .footer { grid-template-columns: 1fr auto; }
      .progress-copy { display: none; }
      .nav-actions { grid-column: 2; }
    }
    @media (max-width: 440px) {
      .topbar { align-items: flex-start; }
      .icon-button { width: 38px; height: 38px; }
      .stepper { gap: 0; }
      .stepper::before { left: 6%; right: 6%; }
      .step-tab .number { width: 27px; height: 27px; border-width: 1.5px; }
      .nav-button { padding: 10px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media print {
      body { background: white; }
      .app { padding: 0; display: block; }
      .top-actions,.stepper,.footer { display: none !important; }
      .topbar { margin-bottom: 16px; }
      .stage { box-shadow: none; min-height: 90vh; border: 1px solid #bbb; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">K</div>
        <div class="brand-text">
          <strong>Kneedle in eight steps</strong>
          <span>A visual lab for finding the knee of the curve</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="printButton" type="button" aria-label="Print or save as PDF" title="Print or save as PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="Toggle full screen" title="Full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Explanation steps"></nav>

    <section class="stage" id="stage" aria-live="polite">
      <article class="explanation">
        <div class="eyebrow" id="eyebrow">Step 1 of 8</div>
        <h1 id="stepTitle"></h1>
        <p class="lead" id="stepDescription"></p>
        <div class="insight" id="stepInsight"></div>
      </article>
      <div class="visual">
        <div class="visual-content" id="visualContent"></div>
        <div class="final-quote">Kneedle finds the geometric boundary between the extreme tail and the predominant behavior of the distribution.</div>
      </div>
    </section>

    <footer class="footer">
      <div class="progress-copy" id="progressCopy">Step 1 of 8</div>
      <div class="nav-actions">
        <button class="nav-button" id="previousButton" type="button">← Previous</button>
        <button class="nav-button next" id="nextButton" type="button">Next →</button>
      </div>
      <div class="keyboard-tip">Use ← → or Spacebar</div>
    </footer>
  </main>

          const curvePts=sortedValues.map((v,i)=>`${x(i+1)},${y(v)}`).join(' ');
          const chordPts=`${x(n)},${y(end[1])} ${x(1)},${y(start[1])}`;
          fills=`<polygon class="side-zone" points="${curvePts} ${chordPts}"/>`;
        }
        const segments=selected.map(i=>{const p=projection(i+1,sortedValues[i]);return `<line class="${all?'distance-faint':'distance'}" x1="${x(i+1)}" y1="${y(sortedValues[i])}" x2="${p.x}" y2="${p.y}"/>`;}).join('');
        const kneeP=projection(kneePosition,sortedValues[kneeZero]);
        const kneeMark=knee?`<line class="distance" x1="${x(kneePosition)}" y1="${y(sortedValues[kneeZero])}" x2="${kneeP.x}" y2="${kneeP.y}"/><circle class="knee-ring" cx="${x(kneePosition)}" cy="${y(sortedValues[kneeZero])}" r="10"/><circle class="point-tail" cx="${x(kneePosition)}" cy="${y(sortedValues[kneeZero])}" r="4.6"/><text class="annotation-orange" x="${x(kneePosition)+16}" y="${y(sortedValues[kneeZero])+24}">Knee: position ${kneePosition}</text>`:'';
        visualContent.innerHTML=`<p class="chart-title">${knee?'The maximum distance reveals the knee':side?'Selected side for the upper tail':'Perpendicular distances to the line'}</p><p class="chart-subtitle">${side?'With sign = −1, this curvature yields positive scores.':'The distance is measured by the determinant divided by the line length.'}</p>${svgFrame(`${axes()}${fills}${curvePaths()}${chord()}${segments}${points(sortedValues,cutoffClass)}${kneeMark}`,knee?`Knee of the curve highlighted at position ${kneePosition}`:'Distances between the curve and reference line')}${side?'<div class="formula"><code>score = sign × −1 × distance</code> &nbsp; with &nbsp; <strong>sign = −1</strong></div>':'<div class="distance-readout"><span>Point close to line → <strong>small distance</strong></span><span>Point at the bend → <strong>large distance</strong></span></div>'}`;
      }
      function renderPercent() {
        const xK=x(kneePosition);
        visualContent.innerHTML=`<p class="chart-title">The position becomes a cumulative proportion</p><p class="chart-subtitle">The first ${kneePosition} points account for ${pctFmt(pct)} of the sorted sample.</p>${svgFrame(`${axes()}<rect class="tail-zone" x="${M.l}" y="${M.t}" width="${xK-M.l+6}" height="${H-M.t-M.b}"/>${curvePaths()}${points(sortedValues,cutoffClass)}<path class="brace" d="M ${M.l} ${H-M.b+36} Q ${(M.l+xK)/2} ${H-M.b+50} ${xK} ${H-M.b+36}"/><text class="annotation-orange" x="${(M.l+xK)/2}" y="${H-1}" text-anchor="middle">${kneePosition} of ${n}</text>`,`First ${kneePosition} points correspond to ${pctFmt(pct)} of the ${n} observations`)}<div class="metric-row"><div class="metric"><span>Position</span><strong>${kneePosition}</strong></div><div class="metric"><span>Sample size</span><strong>${n}</strong></div><div class="metric orange"><span>Cumulative percentage</span><strong>${pctFmt(pct)}</strong></div></div>`;
      }
      function renderCutoff() {
        const cutoffY=y(cutoff);
        visualContent.innerHTML=`<p class="chart-title">The quantile transforms the position into a cutoff point</p><p class="chart-subtitle">Quantile 1 − ${pctFmt(pct)} = ${pctFmt(1-pct)}.</p>${svgFrame(`${axes()}<rect class="tail-zone" x="${M.l}" y="${M.t}" width="${W-M.l-M.r}" height="${cutoffY-M.t}"/>${curvePaths()}<line class="cutoff" x1="${M.l}" y1="${cutoffY}" x2="${W-M.r}" y2="${cutoffY}"/>${points(sortedValues,cutoffClass)}<text class="annotation-orange" x="${W-M.r-5}" y="${cutoffY-10}" text-anchor="end">Cutoff = ${fmt(cutoff)}</text><text class="annotation-orange" x="${x(3)}" y="${M.t+22}">${flagged} cases in the upper tail</text>`,`Cutoff point at ${fmt(cutoff)} with upper tail highlighted`)}<div class="metric-row"><div class="metric"><span>Quantile used</span><strong>${pctFmt(1-pct)}</strong></div><div class="metric orange"><span>Cutoff point</span><strong>${fmt(cutoff)}</strong></div><div class="metric"><span>Flagged</span><strong>${flagged} (${pctFmt(flagged/n)})</strong></div></div>`;
      }

      const renderers=[renderOrdering,renderPoints,renderChord,()=>renderDistances(false,false,false),()=>renderDistances(true,true,false),()=>renderDistances(true,false,true),renderPercent,renderCutoff];
      function render(){
        const step=steps[currentStep];
        document.getElementById('eyebrow').textContent=`Step ${currentStep+1} of 8`;
        document.getElementById('stepTitle').textContent=step.title;
        document.getElementById('stepDescription').textContent=step.description;
        document.getElementById('stepInsight').textContent=step.insight;
        document.getElementById('progressCopy').textContent=`Step ${currentStep+1} of 8`;
        stage.className=`stage step-${currentStep+1}`;
        previousButton.disabled=currentStep===0;
        previousButton.style.opacity=currentStep===0?'.4':'1';
        nextButton.textContent=currentStep===steps.length-1?'Restart ↺':'Next →';
        stepper.innerHTML=steps.map((item,index)=>`<button class="step-tab ${index<currentStep?'done':''} ${index===currentStep?'active':''}" type="button" data-step="${index}" aria-current="${index===currentStep?'step':'false'}" aria-label="Step ${index+1}: ${item.title}"><span class="number">${index+1}</span><span class="label">${item.tab}</span></button>`).join('');
        stepper.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{currentStep=Number(button.dataset.step);render();}));
        renderers[currentStep]();
      }
      function move(delta){
        if(delta>0&&currentStep===steps.length-1)currentStep=0;
        else currentStep=Math.max(0,Math.min(steps.length-1,currentStep+delta));
        render();
      }
      previousButton.addEventListener('click',()=>move(-1));
      nextButton.addEventListener('click',()=>move(1));
      document.getElementById('printButton').addEventListener('click',()=>window.print());
      document.getElementById('fullscreenButton').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(_){}});
      document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' '){event.preventDefault();move(1);}if(event.key==='ArrowLeft'){event.preventDefault();move(-1);}});
      render();
    })();
  </script>
</body>
</html>
